<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jsQuiz08 - querySelectorAll と filter / map</title>
    <style>
      body {
        width: 700px;
        margin: 20px auto;
        padding: 0 16px;
      }

      .filter-buttons {
        margin: 20px 0;
      }

      .filter-buttons button {
        padding: 6px 12px;
        margin-right: 6px;
        cursor: pointer;
      }

      .gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .card {
        width: 110px;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 12px;
        text-align: center;
      }

      .card-emoji {
        font-size: 3rem;
        line-height: 1.2;
      }

      .card-name {
        margin-top: 6px;
        font-size: 0.9rem;
      }

      .result {
        margin-top: 20px;
        padding: 12px;
        background: #f5f5f5;
        border-radius: 8px;
        min-height: 1.5rem;
      }
    </style>
  </head>
  <body>
    <h1>絵文字ギャラリー</h1>

    <!-- カードは HTML にすべて並べてあります（書き換えないこと） -->
    <div class="gallery">
      <div class="card" data-category="fruit">
        <div class="card-emoji">🍎</div>
        <div class="card-name">りんご</div>
      </div>
      <div class="card" data-category="fruit">
        <div class="card-emoji">🍊</div>
        <div class="card-name">みかん</div>
      </div>
      <div class="card" data-category="fruit">
        <div class="card-emoji">🍇</div>
        <div class="card-name">ぶどう</div>
      </div>
      <div class="card" data-category="animal">
        <div class="card-emoji">🐶</div>
        <div class="card-name">いぬ</div>
      </div>
      <div class="card" data-category="animal">
        <div class="card-emoji">🐱</div>
        <div class="card-name">ねこ</div>
      </div>
      <div class="card" data-category="animal">
        <div class="card-emoji">🐼</div>
        <div class="card-name">ぱんだ</div>
      </div>
      <div class="card" data-category="food">
        <div class="card-emoji">🍜</div>
        <div class="card-name">ラーメン</div>
      </div>
      <div class="card" data-category="food">
        <div class="card-emoji">🍣</div>
        <div class="card-name">すし</div>
      </div>
      <div class="card" data-category="food">
        <div class="card-emoji">🍰</div>
        <div class="card-name">ケーキ</div>
      </div>
    </div>

    <div class="filter-buttons">
      <button class="filter-btn filter-all-btn" data-category="all">すべて</button>
      <button class="filter-btn" data-category="fruit">くだもの</button>
      <button class="filter-btn" data-category="animal">どうぶつ</button>
      <button class="filter-btn" data-category="food">たべもの</button>
    </div>

    <!-- ボタンで選んだカテゴリの「なまえ一覧」がここに出ます -->
    <p class="result"></p>

    <script>
      // ===== 「取得」と「表示」は用意済みです（書き換えないこと）=====

      const result = document.querySelector('.result');
      const buttons = document.querySelectorAll('.filter-btn');

      // カテゴリを選ぶと、そのカテゴリのカードの「なまえ一覧」を表示する（用意済み）。
      const showCategory = function (category) {
        // HTML に並んだカードを取得して配列にする。
        // querySelectorAll が返す NodeList は map/filter が使えないので、
        // Array.from で「配列」に変換しておく。
        const cards = Array.from(document.querySelectorAll('.card'));

        let selected;
        if (category === 'all') {
          selected = cards;
        } else {
          selected = filterByCategory(cards, category);
        }

        const names = toNames(selected);
        result.textContent = names.join('、');
      };

      // 各ボタンを押すと、そのカテゴリを表示する（用意済み）。
      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          showCategory(btn.getAttribute('data-category'));
        });
      });

      // 最初はすべて表示しておく（用意済み）。
      showCategory('all');

      // ===== ここから下があなたの課題です =====
      //
      // students/{あなたの学籍番号}/index.html にコピーして提出してください。
      //
      // やること:
      //   次の2つの関数を作る。
      //
      //   1) filterByCategory(cards, category)   … filter だけを使う
      //        カード要素の配列 cards から、data-category が category と一致するものだけを
      //        filter で絞り込んで return する。
      //
      //   2) toNames(cards)                      … map だけを使う
      //        カード要素の配列 cards を、各カードの名前（.card-name の文字）の配列に
      //        map で変換して return する。
      //
      // 【ヒント】
      //   function filterByCategory(cards, category) {
      //     return cards.filter(function (card) {
      //       return card.dataset.category === category; // data-category の値
      //     });
      //   }
      //
      //   function toNames(cards) {
      //     return cards.map(function (card) {
      //       return card.querySelector('.card-name').textContent; // カードの名前
      //     });
      //   }

      // --- 模範解答（動作確認用）---
      function filterByCategory(cards, category) {
        return cards.filter(function (card) {
          return card.dataset.category === category;
        });
      }

      function toNames(cards) {
        return cards.map(function (card) {
          return card.querySelector('.card-name').textContent;
        });
      }
    </script>
  </body>
</html>
